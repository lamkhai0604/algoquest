# Render Blueprint for the backend (T-307, D-037). Free web service, Docker build.
# Secrets are marked sync: false: Render asks for their values when the Blueprint is created,
# and they are never stored in this file.
services:
  - type: web
    name: algoquest-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    branch: main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JUDGE0_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GRADING_PROVIDER
        value: gemini
