name: docs

on:
  push:
    branches: ["**"]
    paths: ["**/*.md", "scripts/check-records.mjs", ".github/workflows/docs.yml"]
  pull_request:
    branches: [dev, main]
    paths: ["**/*.md", "scripts/check-records.mjs", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

# bash runs with -eo pipefail, so a failing command piped into tee fails the step.
defaults:
  run:
    shell: bash

jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Records check self-test (each rule fails on a seeded violation)
        run: node scripts/check-records.mjs --self-test

      - name: Records check (D-038)
        run: node scripts/check-records.mjs
