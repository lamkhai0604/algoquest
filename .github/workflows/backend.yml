name: backend

on:
  push:
    branches: ["**"]
    paths: ["backend/**", "content/**", "docker-compose.yml", ".env.example", ".github/workflows/backend.yml"]
  pull_request:
    branches: [dev, main]
    paths: ["backend/**", "content/**", "docker-compose.yml", ".env.example", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

# bash runs with -eo pipefail, so a failing command piped into tee fails the step.
defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Format, compile, test (./mvnw verify)
        run: ./mvnw -B -ntp verify 2>&1 | tee build.log

      - name: Test summary
        run: |
          total=0; failed=0
          for f in target/surefire-reports/TEST-*.xml; do
            suite=$(grep -m1 -o '<testsuite [^>]*>' "$f")
            attr() { v=$(echo "$suite" | grep -o " $1=\"[0-9]*\"" | tr -dc 0-9); echo "${v:-0}"; }
            n=$(( $(attr failures) + $(attr errors) ))
            total=$((total + $(attr tests))); failed=$((failed + n))
            if [ "$n" -gt 0 ]; then
              python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for problem in list(case.findall("error")) + list(case.findall("failure")):
                  text = (problem.get("message") or "") + " | " + (problem.text or "")[:1500]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::warning title={case.get('name')}::{text}")
          PY
            fi
          done
          echo "::notice title=backend tests::${total} tests, ${failed} failed"

      - name: Build Docker image
        run: docker build -f Dockerfile -t algoquest-backend:ci ..

      - name: Report failure details as annotations
        if: failure()
        run: |
          set +e  # collect as much detail as possible
          annotate() { # title, file: emits up to 5 annotations of about 3,000 characters each
            [ -s "$2" ] || return 0
            split -C 3000 "$2" /tmp/chunk-
            for c in $(ls /tmp/chunk-* | head -5); do
              echo "::error title=$1::$(sed -e 's/%/%25/g' "$c" | sed -e ':a;N;$!ba;s/\r//g;s/\n/%0A/g')"
            done
            rm -f /tmp/chunk-*
          }
          [ -f build.log ] && grep -E '^\[ERROR\]|FAIL|Caused by' build.log | head -60 > /tmp/errors.txt
          annotate "maven errors" /tmp/errors.txt
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -qE 'FAILURE|ERROR' "$f" && annotate "$(basename "$f")" "$f"
          done
          if ./mvnw -B -q -ntp spotless:apply >/dev/null 2>&1; then
            git diff > /tmp/format.diff
            annotate "spotless diff" /tmp/format.diff
          fi

  local-dev:
    # Follows the README "Run locally" steps for the backend (T-103).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Settings and database (README steps 1-2)
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - name: Backend starts and reports healthy (README step 3)
        working-directory: backend
        run: |
          ./mvnw -B -ntp -q package -DskipTests
          java -jar target/algoquest-backend.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "Backend healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error title=backend did not become healthy::$(tail -c 3000 app.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\r//g;s/\n/%0A/g')"
          exit 1
